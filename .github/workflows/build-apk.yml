name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # sdkmanager needs JDK 17; the BlackBox engine (Android Gradle Plugin 7.2 / Gradle 7.3) builds with JDK 11.
      # Both get installed; 17 is the default, and the Gradle step switches to 11.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            11
            17

      - name: Install Android SDK platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-32" "build-tools;30.0.3"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          export JAVA_HOME="$JAVA_HOME_11_X64"
          java -version
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk out/GameTabs.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: GameTabs-apk
          path: out/*.apk

      # Publishes a "latest" release so the APK can be downloaded straight from a phone browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GameTabs latest build
          prerelease: true
          files: out/*.apk
          # remove APKs from older builds
          make_latest: false
          body: |
            Built from ${{ github.sha }}.
            Install **GameTabs.apk**.
