name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The BlackBox engine uses Android Gradle Plugin 7.2, which needs JDK 11.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: android-actions/setup-android@v3

      - name: Install SDK, NDK and CMake used by the engine
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-32" "build-tools;30.0.3" "ndk;23.1.7779620" "cmake;3.18.1"

      - uses: gradle/actions/setup-gradle@v3

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleArm64Release assembleArm32Release

      - name: Collect APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/arm64/release/*.apk out/GameTabs-arm64.apk
          cp app/build/outputs/apk/arm32/release/*.apk out/GameTabs-arm32.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: GameTabs-apk
          path: out/*.apk

      # Publishes a "latest" release so the APK can be downloaded straight from a phone browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GameTabs latest build
          prerelease: true
          files: out/*.apk
          body: |
            Built from ${{ github.sha }}.
            Install **GameTabs-arm64.apk** (works for almost every phone and game).
            Use GameTabs-arm32.apk only for old 32-bit games.
